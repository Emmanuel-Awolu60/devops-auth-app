version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: devops_auth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devops_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: devops_auth_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devops_auth
      DB_USER: postgres
      DB_PASSWORD: yourpassword
      JWT_SECRET: change_this_in_production
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: devops_auth_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"

volumes:
  pgdata: